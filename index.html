<html lang="tr">
<head>
<meta charset="UTF-8">

<title>Pony Prenses - At Giydirme Oyunu</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: #ffe7f3;
    color: #874b87;
}

button {
    font-family: inherit;
    cursor: pointer;
}

header {
    text-align: center;
    padding: 18px;
    background: linear-gradient(120deg,#ff8dc9,#c99bff,#8edcff);
    color: white;
    border-bottom: 5px solid white;
}

header h1 {
    font-size: 32px;
    margin: 5px;
    text-shadow: 2px 3px 3px #a95a9a;
}

header p {
    font-size: 15px;
    margin: 5px;
}

.game {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

.top-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
}

.pill {
    background: white;
    padding: 10px 17px;
    border-radius: 25px;
    box-shadow: 0 3px 8px #e5b5d5;
    font-weight: bold;
}

.game-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
    gap: 16px;
}

.stage {
    background: white;
    border: 5px solid #ffc0e1;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 6px 15px #dba8ca;
}

.stage-title {
    text-align: center;
    padding: 12px;
    background: #fff0f8;
    font-size: 19px;
    font-weight: bold;
}

.scene {
    position: relative;
    background: linear-gradient(#bceeff 0%,#e4faff 62%,#a5e7a0 63%,#79ce87 100%);
    min-height: 450px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.scene svg {
    width: 100%;
    max-height: 470px;
    position: relative;
    z-index: 2;
}

.cloud {
    position: absolute;
    color: white;
    font-size: 55px;
    opacity: .9;
}

.cloud.one { top: 25px; left: 8%; }
.cloud.two { top: 75px; right: 10%; }

.flower {
    position: absolute;
    bottom: 8px;
    font-size: 28px;
}

.flower.a { left: 5%; }
.flower.b { left: 23%; }
.flower.c { right: 20%; }
.flower.d { right: 5%; }

.character-name {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    background: #fff;
    border: 2px solid #ffaad5;
    padding: 7px 20px;
    border-radius: 20px;
    font-weight: bold;
    color: #d65b9c;
}

.panel {
    background: white;
    border: 4px solid #ffc0e1;
    border-radius: 25px;
    padding: 14px;
    box-shadow: 0 5px 12px #dfb0d0;
}

.panel h2 {
    text-align: center;
    margin: 5px 0 12px;
    color: #dc69a7;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
    margin-bottom: 12px;
}

.tab {
    background: #ffe5f2;
    color: #a94d88;
    border: 2px solid #ffc1df;
    border-radius: 12px;
    padding: 11px 4px;
    font-size: 13px;
    font-weight: bold;
}

.tab.active {
    background: #ed85bd;
    color: white;
    border-color: #d45b9d;
}

.items {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
    max-height: 330px;
    overflow-y: auto;
    padding: 5px;
}

.item {
    background: #fff0f7;
    border: 2px solid #ffd0e7;
    border-radius: 15px;
    min-height: 90px;
    padding: 7px 3px;
    color: #985c8b;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    transition: .2s;
}

.item:hover {
    background: #ffd4eb;
    transform: translateY(-3px);
}

.item.selected {
    background: #f9a5d0;
    border: 3px solid #d94f9a;
    color: white;
}

.item-icon {
    font-size: 30px;
}

.colors {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 15px 5px;
}

.color {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid white;
    outline: 2px solid #eab5d7;
}

.color:hover {
    transform: scale(1.15);
}

.actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
}

.action {
    background: linear-gradient(120deg,#ff9dce,#ca94f5);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 12px 15px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 3px 6px #d7a0c7;
}

.action:hover {
    filter: brightness(1.06);
    transform: scale(1.04);
}

.action.secondary {
    background: #91cffa;
}

.message {
    text-align: center;
    padding: 14px;
    margin-top: 14px;
    border-radius: 17px;
    background: #fff0f8;
    font-size: 17px;
    font-weight: bold;
    color: #d45e9f;
    min-height: 48px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #a75c95;
}

.hidden {
    display: none;
}

@media(max-width:750px) {
    .game-layout {
        grid-template-columns: 1fr;
    }

    .scene {
        min-height: 350px;
    }

    .scene svg {
        max-height: 390px;
    }

    header h1 {
        font-size: 25px;
    }
}

@media(max-width:380px) {
    .items {
        grid-template-columns: repeat(2,1fr);
    }
}
</style>
</head>

    if(tab === "color") {
        items.classList.add("hidden");
        colors.classList.remove("hidden");
        drawColors();
        return;
    }

    items.classList.remove("hidden");
    colors.classList.add("hidden");

    if(tab === "scene") {
        drawScenes();
        return;
    }

    if(tab === "mane") {
        drawMane();
        return;
    }

    let list = inventory[tab] || [];

    list.forEach((item,index)=>{

        let button = document.createElement("button");

        button.className = "item";

        button.innerHTML = `
            <span class="item-icon">${item.icon}</span>
            <span>${item.name}</span>
        `;

        button.onclick = ()=>selectItem(tab,index);

        items.appendChild(button);

    });

    let remove = document.createElement("button");
    remove.className = "item";
    remove.innerHTML = `
        <span class="item-icon">❌</span>
        <span>Süslemeyi Kaldır</span>
    `;
    remove.onclick = ()=>removeItem(tab);

    items.appendChild(remove);

    updateMessage("Harika! Bir aksesuar seçebilirsin! 💗");
}

// AKSESUAR SEÇ

function selectItem(tab,index) {

    selections[tab] = index;

    const layerNames = {
        head:"headLayer",
        dress:"dressLayer",
        saddle:"saddleLayer",
        neck:"neckLayer",
        extras:"wingLayer",
        glasses:"glassesLayer"
    };

    let layer = document.getElementById(layerNames[tab]);

    layer.innerHTML = inventory[tab][index].svg;

    showSelected(tab,index);

    updateMessage(inventory[tab][index].name +
        " çok yakıştı! 🌸");
}

// SEÇİMİ GÖSTER

function showSelected(tab,index) {

    document.querySelectorAll("#items .item").forEach((b,i)=>{
        b.classList.toggle("selected",i===index);
    });

}

// KALDIR

function removeItem(tab) {

    const layerNames = {
        head:"headLayer",
        dress:"dressLayer",
        saddle:"saddleLayer",
        neck:"neckLayer",
        extras:"wingLayer",
        glasses:"glassesLayer"
    };

    selections[tab] = -1;

    document.getElementById(layerNames[tab]).innerHTML = "";

    updateMessage("Tamam! Şimdi başka bir süs seçebilirsin. 💕");
}

// YELE RENKLERİ

function drawMane() {

    const items = document.getElementById("items");

    items.innerHTML = "";

    maneColors.forEach((color,index)=>{

        const b = document.createElement("button");
        b.className = "item";

        b.innerHTML = `
            <span style="
                width:38px;
                height:38px;
                border-radius:50%;
                background:${color};
                border:3px solid white;
                box-shadow:0 0 0 2px #dda7cd;
            "></span>
            <span>Yele Rengi ${index+1}</span>
        `;

        b.onclick = ()=>{

            currentMane = index;

            document.getElementById("mane").querySelectorAll("path")
                [0].setAttribute("fill",color);

            document.querySelector("#mane path").setAttribute(
                "fill",color
            );

            updateMessage("Yele rengin değişti! Çok güzel! 🌈");

        };

        items.appendChild(b);

    });

    let comb = document.createElement("button");
    comb.className = "item";
    comb.innerHTML = `<span class="item-icon">💇</span><span>Yelemi Tara</span>`;
    comb.onclick = ()=>{
        document.getElementById("mane").animate(
            [
                {transform:"rotate(0deg)"},
                {transform:"rotate(5deg)"},
                {transform:"rotate(-5deg)"},
                {transform:"rotate(0deg)"}
            ],
            {duration:600}
        );
        updateMessage("Mis gibi oldu! Yelen tarandı! 💖");
    };

    items.appendChild(comb);
}

// AT RENKLERİ

function drawColors() {

    const colors = document.getElementById("colors");

    colors.innerHTML = `
        <h3 style="width:100%;text-align:center">
        🐴 Atının rengini seç
        </h3>
    `;

    bodyColors.forEach((color,index)=>{

        let b = document.createElement("button");
        b.className = "color";
        b.style.background = color;

        b.onclick = ()=>{

            currentBody = index;

            document.querySelectorAll(
                "#pony > path, #pony > ellipse"
            ).forEach(el=>{
                if(el.getAttribute("fill")==="url(#bodyGradient)") {
                    el.setAttribute("fill",color);
                }
            });

            document.getElementById("pony")
                .querySelectorAll("path,ellipse").forEach(el=>{
                    if(el.getAttribute("fill")==="url(#bodyGradient)") {
                        el.setAttribute("fill",color);
                    }
                });

            updateMessage("Yeni rengin harika görünüyor! 🐴");

        };

        colors.appendChild(b);

    });

}

// ARKA PLANLAR

function drawScenes() {

    const items = document.getElementById("items");

    const scenes = [
        {name:"Çiçek Bahçesi",icon:"🌷",color:
        "linear-gradient(#bceeff 0%,#e4faff 62%,#a5e7a0 63%,#79ce87 100%)"},

        {name:"Pembe Saray",icon:"🏰",color:
        "linear-gradient(#ffc4e7,#f4c7ff 65%,#d9a2e9 66%)"},

        {name:"Gökkuşağı Dünyası",icon:"🌈",color:
        "linear-gradient(#9fe5ff,#ffd5ed 65%,#b7efb1 66%)"},

        {name:"Deniz Kenarı",icon:"🏖",color:
        "linear-gradient(#77d9ff,#b9f3ff 65%,#f9e3a7 66%)"},

        {name:"Gece Masalı",icon:"🌙",color:
        "linear-gradient(#343b83,#8e82d6 65%,#526e9a 66%)"},

        {name:"Şeker Dünyası",icon:"🍭",color:
        "linear-gradient(#ffb5e0,#e8baff 65%,#b9e6ff 66%)"}
    ];

    scenes.forEach(scene=>{

        let b = document.createElement("button");
        b.className = "item";

        b.innerHTML = `
            <span class="item-icon">${scene.icon}</span>
            <span>${scene.name}</span>
        `;

        b.onclick = ()=>{

            document.getElementById("scene").style.background =
                scene.color;

            updateMessage(scene.name+" seçildi! 🌟");

        };

        items.appendChild(b);

    });

}

// MESAJ

function updateMessage(text) {
    document.getElementById("message").textContent = text;
}

// RASTGELE TASARIM

function randomStyle() {

    Object.keys(inventory).forEach(tab=>{

        let max = inventory[tab].length;

        let index = Math.floor(Math.random()*max);

        selections[tab] = index;

        const layerNames = {
            head:"headLayer",
            dress:"dressLayer",
            saddle:"saddleLayer",
            neck:"neckLayer",
            extras:"wingLayer",
            glasses:"glassesLayer"
        };

        document.getElementById(layerNames[tab]).innerHTML =
            inventory[tab][index].svg;

    });

    updateMessage("🎉 Sürpriz! Prenses atın hazır!");
}

// HER ŞEYİ SIFIRLA

function resetAll() {

    Object.keys(selections).forEach(tab=>{
        selections[tab] = -1;
    });

    [
        "headLayer",
        "dressLayer",
        "saddleLayer",
        "neckLayer",
        "wingLayer",
        "glassesLayer",
        "sparkleLayer"
    ].forEach(id=>{
        document.getElementById(id).innerHTML = "";
    });

    currentMane = 0;
    currentBody = 0;

    document.getElementById("pony").querySelectorAll(
        "path,ellipse"
    ).forEach(el=>{
        if(el.getAttribute("fill")==="url(#bodyGradient)") {
            el.setAttribute("fill","url(#bodyGradient)");
        }
    });

    document.getElementById("scene").style.background =
        "linear-gradient(#bceeff 0%,#e4faff 62%,#a5e7a0 63%,#79ce87 100%)";

    document.getElementById("ponyName").textContent =
        "Prenses Boncuk";

    updateMessage("Yeni maceraya hazırız! 🌸");

    showTab("head",document.querySelector(".tab"));

}

// FOTOĞRAF ÇEK

function savePicture() {

    const svg = document.getElementById("pony");

    const clone = svg.cloneNode(true);

    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");

    const source = new XMLSerializer().serializeToString(clone);

    const blob = new Blob([source],{
        type:"image/svg+xml;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);

    const image = new Image();

    image.onload = ()=>{

        const canvas = document.createElement("canvas");

        canvas.width = 1000;
        canvas.height = 880;

        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#ffe7f3";
        ctx.fillRect(0,0,1000,880);

        ctx.drawImage(image,0,0,1000,880);

        const link = document.createElement("a");

        link.download = "benim-prenses-atim.png";
        link.href = canvas.toDataURL("image/png");

        link.click();

        URL.revokeObjectURL(url);

        updateMessage("Fotoğrafın hazır! 📸💗");

    };

    image.src = url;

}

showTab("head",document.querySelector(".tab"));
